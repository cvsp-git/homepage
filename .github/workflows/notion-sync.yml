name: Notion sync
# 노션(공개 페이지)에서 News / Gallery / LAB Life 카드와 멤버 개인 페이지를 가져와 반영합니다.
# 15분마다 자동 실행됩니다. Actions 탭 > Notion sync > Run workflow 로 바로 실행할 수도 있습니다.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "모든 페이지를 처음부터 다시 만들기"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
concurrency:
  group: notion-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: tools/notion-sync/requirements.txt}
      - run: pip install -q -r tools/notion-sync/requirements.txt
      - name: Install ffmpeg (for videos and large GIFs)
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)
      - name: Pull from Notion
        run: python3 tools/notion-sync/sync.py ${{ (github.event_name == 'workflow_dispatch' && inputs.full) && '--full' || '' }}
      - name: Commit and publish
        run: |
          git config user.name "notion-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes in Notion."; exit 0; fi
          git commit -qm "Sync from Notion"
          ok=
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && ok=1 && break; sleep 5; done
          [ -n "$ok" ] || { echo "push failed"; exit 1; }
          curl -sS -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
