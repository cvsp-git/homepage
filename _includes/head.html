<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }} · {{ site.university }}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.long_title }}">
<meta property="og:description" content="{{ site.description | strip_newlines }}">
<meta property="og:type" content="website">
<meta name="theme-color" content="#061325">
<link rel="icon" href="{{ '/images/logo/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
