<footer class="site-footer">
  <div class="wrap footer-grid">
    <div class="footer-id">
      <img class="footer-logo" src="{{ '/images/logo/cvsp-logo-color-light.png?v=3' | relative_url }}" alt="CVSP Lab, Computer Vision &amp; Signal Processing" width="573" height="137" loading="lazy">
      <p class="footer-ko">{{ site.university_ko }} {{ site.department_ko }} · {{ site.korean_title }}</p>
      <p class="footer-addr">{{ site.address }}</p>
    </div>
    <dl class="footer-contact">
      <div><dt>Email</dt><dd><a href="mailto:{{ site.email }}">{{ site.email }}</a></dd></div>
      <div><dt>Phone</dt><dd>{{ site.phone }}</dd></div>
      <div><dt>Project pages</dt><dd><a href="{{ site.project_pages }}">paper.pnu-cvsp.com</a></dd></div>
      <div><dt>Code</dt><dd><a href="{{ site.github }}">github.com/cvsp-lab</a></dd></div>
    </dl>
  </div>
  <div class="wrap footer-base">
    <span>© {{ site.time | date: '%Y' }} CVSP Lab, Pusan National University</span>
    <span class="mono">35.2316° N, 129.0825° E</span>
  </div>
</footer>
