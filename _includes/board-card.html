{% assign b = include.b %}
<a class="bcard bcard-{{ b.kind }}{% if include.more %} is-more{% endif %}" href="{{ b.url | relative_url }}"{% if include.more %} hidden{% endif %}>
  <span class="bcard-img{% if b.image == '' %} is-empty{% endif %}">
    {% if b.image != "" %}<img src="{% if b.image contains '://' %}{{ b.image }}{% else %}{{ '/images/gallery/' | append: b.image | relative_url }}{% endif %}" alt="" loading="lazy">{% endif %}
  </span>
  <span class="bcard-body">
    <span class="bcard-meta"><span class="bcard-tag">#{{ b.tag }}</span><time datetime="{{ b.date | date: '%Y-%m-%d' }}">{{ b.date | date: "%-m" }}월, {{ b.date | date: "%Y" }}</time></span>
    <span class="bcard-title">{{ b.title }}</span>
  </span>
</a>
