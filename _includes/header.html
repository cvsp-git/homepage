<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="CVSP Lab home">
      <img class="brand-logo" src="{{ '/images/logo/cvsp-logo-dark.png' | relative_url }}" alt="CVSP Lab" width="573" height="137">
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="sr">Menu</span><span class="bars" aria-hidden="true"></span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      {% for item in site.data.navigation %}
        {% assign item_page = item.url | remove: '/' | remove: '.html' | split: '#' | first | default: 'index' %}
        <a href="{{ item.url | relative_url }}" class="{% if item.cta %}nav-cta{% endif %}{% unless item.url contains '#' %}{% if page.slug == item_page %} is-active{% endif %}{% endunless %}">{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
