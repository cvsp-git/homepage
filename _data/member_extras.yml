# ─────────────────────────────────────────────
# 멤버 추가 정보 (노션에 없는 것만)
# - 누가 어느 과정에 있는지, 순서, 졸업(Alumni) 여부는 노션 MEMBERS(LABDB_family)의 status 를 따릅니다.
#   새 멤버도 노션에 추가하면 Members 화면에 자동으로 나옵니다.
# - 여기에는 이름(name, 노션과 똑같이)을 기준으로 한글 이름, 사진, 수상 같은 추가 정보만 적습니다.
#   group 은 참고용이며 화면 순서에는 쓰이지 않습니다.
# - photo: 카드 사진은 개인 Notion 페이지의 프로필 사진(첫 상자 안 첫 사진)을 4:5로 잘라 자동으로 씁니다.
#   개인 페이지에 사진이 없을 때만 여기 photo(images/members/ 폴더) → 노션 Profile image 순서로 씁니다.
# - honors: 장학·파견·수상 등 이름 아래 작은 글씨 (여러 줄 가능). Alumni의 note는 현재 소속.
