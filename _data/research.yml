# 홈 화면 "Research" 영역. tag는 논문 데이터의 tags와 같아야 관련 논문이 자동으로 붙습니다.
- title: 3D/4D World Modeling
  tag: World Modeling
  summary: >-
    Reconstructing and generating dynamic 3D worlds with Gaussian splatting,
    from single images, monocular video, and multi-view capture.
  keywords: [Gaussian Splatting, Dynamic Scene Reconstruction, 4D Generation]
- title: Efficient Vision-Language Models and Vision-Language-Action Models
  tag: Efficient
  summary: >-
    Making multimodal foundation models fast and trustworthy through visual token pruning,
    model compression, and reliable multimodal reasoning.
  keywords: [Token Pruning, Model Compression, Hallucination Mitigation]
- title: Embodied Spatial Intelligence
  tag: Robotics
  summary: >-
    Perception and decision-making for robots acting in real homes and workplaces,
    from open-vocabulary detection to spatial reasoning.
  keywords: [Home Robots, Open-Vocabulary Perception, Spatial Reasoning]
