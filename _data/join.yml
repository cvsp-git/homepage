# ─────────────────────────────────────────────
# Join Us / Contact 페이지 내용 (join.html)
# notice: 맨 위 안내 문구 (여러 줄 가능)
# principles: 연구실 원칙
# tracks: 모집 분야. role(하는 일), apply(지원 절차, 순서대로), recommended(권장 사항)
#         notice 가 있으면 카드 위에 강조 표시됩니다. 항목이 없으면 줄을 지우세요.
# ─────────────────────────────────────────────
notice:
  - "Our lab works on computer vision, multimodal AI, 3D/4D spatial intelligence, and robot visual intelligence."
  - "We regularly recruit undergraduate research interns, graduate students, and postdoctoral researchers. Please contact us by email before applying."
  - "Interested students: send a brief self-introduction, your research interests, and a transcript or CV to the email below."

principles:
  - "We value a respectful and inclusive lab culture."
  - "We pursue collaboration over competition, so that we grow together."
  - "We welcome self-motivated students."
  - "We offer flexible working hours and the freedom to choose where you do research."

tracks:
  - label: Undergraduate
    title: Research Internship
    role:
      - "Study fundamentals of deep learning and computer vision"
      - "Help write and present papers"
      - "Optionally join an ongoing lab project"
    apply:
      - "Email a brief description of the computer vision topics you are interested in."
      - "If positions are open, we will schedule a short interview."
    recommended:
      - "Programming skills (Python, C/C++, MATLAB)"
      - "Basic math: probability, statistics, linear algebra"

  - label: Graduate
    title: M.S. / Ph.D. Students
    notice: "Contact the lab before applying to the PNU Graduate School of Electrical & Electronics Engineering. Doing a research internship first is highly recommended."
    apply:
      - "Email your transcript, CV, and research interests."
      - "Have a preliminary interview with the professor."
      - "Apply to the graduate school. A separate lab interview follows the department interview."
    recommended:
      - "A strong bachelor's degree in a related field"
      - "Programming and math skills"
      - "Deep learning experience through projects or publications"

  - label: Researcher
    title: Researchers & Postdocs
    apply:
      - "Email your transcript, CV, and research interests."
      - "The process is similar to the graduate track: a preliminary interview, followed by further steps if needed."
